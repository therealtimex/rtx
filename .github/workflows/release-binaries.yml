# Build self-contained `rtx` binaries on GitHub-hosted runners and publish them
# as release assets. Asset names match what the installers download:
#   scripts/install.sh  -> rtx-<darwin|linux|linux-musl>-<x64|arm64>
#   scripts/install.ps1 -> rtx-windows-x64.exe
#
# Stages per job (the flow proven to build locally in R1):
#   1. Build the Rust napi native(s) — only linux-x64 ships BOTH tiers (modern +
#      baseline); darwin-x64/windows-x64/arm64 are a single baseline build, which
#      matches upstream (oh-my-pi ci.yml) and keeps the binary ~113 MB smaller.
#   2. `bun run build` (build-binary.ts) embeds native + Bun runtime -> dist/rtx[.exe].
#   3. Rename to the asset name, upload as an artifact, and (on a `v*` tag)
#      attach to the GitHub release.
#
# Run manually (Actions -> Run workflow) for downloadable artifacts, or push a
# `v*` tag to also publish them as release assets.

name: Release rtx binaries

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Windows runners use Git Bash so one script works everywhere.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            asset: rtx-darwin-arm64
            dual_tier: false
          - os: macos-15-intel # Intel
            asset: rtx-darwin-x64
            dual_tier: false
          - os: ubuntu-latest
            asset: rtx-linux-x64
            dual_tier: true
            linux: true
          - os: ubuntu-24.04-arm # GitHub-hosted ARM64 Linux runner
            asset: rtx-linux-arm64
            dual_tier: false
            linux: true
          - os: ubuntu-latest
            asset: rtx-linux-musl-x64
            cross_target: linux-musl-x64
            native_cross_target: x86_64-unknown-linux-musl
            dual_tier: false
            linux: true
            x64: true
          - os: ubuntu-latest
            asset: rtx-linux-musl-arm64
            cross_target: linux-musl-arm64
            native_cross_target: aarch64-unknown-linux-musl
            dual_tier: false
            linux: true
          - os: windows-latest
            asset: rtx-windows-x64.exe
            dual_tier: false
            windows: true

    steps:
      - uses: actions/checkout@v4

      # arboard (clipboard) and other native crates need X11/XCB dev headers on
      # Linux; without them the napi build fails to link.
      - name: Install Linux native build deps
        if: ${{ matrix.linux }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libdbus-1-dev

      - name: Install Linux musl cross deps
        if: ${{ matrix.native_cross_target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.native_cross_target }}

      - name: Setup zig for musl cross build
        if: ${{ matrix.native_cross_target }}
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild for musl cross build
        if: ${{ matrix.native_cross_target }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install dependencies
        run: bun install

      # dual_tier builds both ISA tiers so the runtime loader always finds its
      # match (the modern/baseline trap); only linux-x64 sets it. Single-tier
      # platforms build baseline, which the loader falls back to everywhere.
      - name: Build native addon(s)
        working-directory: packages/natives
        env:
          CROSS_TARGET: ${{ matrix.native_cross_target }}
          TARGET_PLATFORM: ${{ matrix.cross_target && 'linux' || '' }}
          TARGET_ARCH: ${{ matrix.x64 && 'x64' || matrix.native_cross_target && 'arm64' || '' }}
          RUSTFLAGS: ${{ matrix.x64 && '-C target-cpu=x86-64-v2' || '' }}
        run: |
          if [ "${{ matrix.dual_tier }}" = "true" ]; then
            TARGET_VARIANT=modern bun run build
            TARGET_VARIANT=baseline bun run build
          elif [ "${{ matrix.x64 }}" = "true" ]; then
            TARGET_VARIANT=baseline bun run build
          else
            bun run build
          fi

      # `rtx --version` reads packages/utils/package.json's `version` (via
      # pi-utils dirs.ts). Stamp it with the fork's release tag so the version
      # is the comparable semver core that `rtx update` relies on: it fetches
      # this fork's GitHub releases (v0.1.x) and only updates when the release
      # sorts newer than the running version. Upstream's baseline (16.0.6) must
      # NOT be the core or every fork release looks older and the updater is a
      # no-op. On a `v*` tag we stamp the tag (e.g. 0.1.2); manual runs get a
      # `0.0.0-dev.<sha>` prerelease that always sorts below real releases. This
      # is an ephemeral, runner-only edit (like embed:native) — nothing committed.
      - name: Stamp fork version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="0.0.0-dev.${GITHUB_SHA:0:7}"
          fi
          bun -e '
            const fs = require("node:fs");
            const ver = process.argv[1];
            for (const p of ["packages/utils/package.json", "packages/coding-agent/package.json"]) {
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              j.version = ver;
              fs.writeFileSync(p, `${JSON.stringify(j, null, "\t")}\n`);
            }
          ' "$ver"
          echo "Stamped version: $ver"

      - name: Compile self-contained binary
        working-directory: packages/coding-agent
        env:
          CROSS_TARGET: ${{ matrix.cross_target }}
        run: bun run build

      - name: Stage release asset
        run: |
          src="packages/coding-agent/dist/rtx"
          [ -n "${{ matrix.cross_target }}" ] && src="packages/coding-agent/dist/${{ matrix.asset }}"
          [ "${{ matrix.windows }}" = "true" ] && src="packages/coding-agent/dist/rtx.exe"
          mv "$src" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}" || true
          ls -lh "${{ matrix.asset }}"
          echo "ASSET_NAME=${{ matrix.asset }}" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_NAME }}
