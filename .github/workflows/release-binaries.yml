# Build self-contained `omp` binaries on GitHub-hosted runners and publish them
# as release assets named `omp-<platform>-<arch>` (the names `scripts/install.sh`
# downloads). Independent of the upstream `ci.yml`, which builds natives on
# private `omp-kata` runners.
#
# Stages per job (the same flow proven to build locally):
#   1. Build the Rust napi native(s)  — x64 needs BOTH tiers (modern + baseline),
#      arm64 is a single build.
#   2. `bun run build` (build-binary.ts) embeds the native + Bun runtime → dist/omp.
#   3. Rename → `omp-<platform>-<arch>`, upload as an artifact, and (on a `v*`
#      tag) attach to the GitHub release.
#
# Trigger it manually (Actions → Release omp binaries → Run workflow) to get
# downloadable artifacts without cutting a release; push a `v*` tag to also
# publish them as release assets.

name: Release omp binaries

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            platform: darwin
            arch: arm64
            dual_tier: false
          - os: ubuntu-latest
            platform: linux
            arch: x64
            dual_tier: true

    steps:
      - uses: actions/checkout@v4

      # arboard (clipboard) and other native crates need X11/XCB dev headers on
      # Linux; without them the napi build fails to link.
      - name: Install Linux native build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libdbus-1-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      # x64: build both ISA tiers so the runtime loader always finds its match
      # (the modern/baseline trap). arm64 has no tier split.
      - name: Build native addon(s)
        working-directory: packages/natives
        run: |
          if [ "${{ matrix.dual_tier }}" = "true" ]; then
            TARGET_VARIANT=modern bun run build
            TARGET_VARIANT=baseline bun run build
          else
            bun run build
          fi

      - name: Compile self-contained binary
        working-directory: packages/coding-agent
        run: bun run build

      - name: Stage release asset
        run: |
          asset="omp-${{ matrix.platform }}-${{ matrix.arch }}"
          mv packages/coding-agent/dist/omp "$asset"
          chmod +x "$asset"
          ls -lh "$asset"
          file "$asset" || true
          echo "ASSET_NAME=$asset" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_NAME }}
