# Build self-contained `omp` binaries on GitHub-hosted runners and publish them
# as release assets. Asset names match what the installers download:
#   scripts/install.sh  -> omp-<darwin|linux>-<x64|arm64>
#   scripts/install.ps1 -> omp-windows-x64.exe
#
# Stages per job (the flow proven to build locally in R1):
#   1. Build the Rust napi native(s) — x64 needs BOTH tiers (modern + baseline);
#      arm64 is a single build.
#   2. `bun run build` (build-binary.ts) embeds native + Bun runtime -> dist/omp[.exe].
#   3. Rename to the asset name, upload as an artifact, and (on a `v*` tag)
#      attach to the GitHub release.
#
# Run manually (Actions -> Run workflow) for downloadable artifacts, or push a
# `v*` tag to also publish them as release assets.

name: Release omp binaries

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Windows runners use Git Bash so one script works everywhere.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            asset: omp-darwin-arm64
            dual_tier: false
          - os: macos-13 # Intel
            asset: omp-darwin-x64
            dual_tier: true
          - os: ubuntu-latest
            asset: omp-linux-x64
            dual_tier: true
            linux: true
          - os: ubuntu-24.04-arm # GitHub-hosted ARM64 Linux runner
            asset: omp-linux-arm64
            dual_tier: false
            linux: true
          - os: windows-latest
            asset: omp-windows-x64.exe
            dual_tier: true
            windows: true

    steps:
      - uses: actions/checkout@v4

      # arboard (clipboard) and other native crates need X11/XCB dev headers on
      # Linux; without them the napi build fails to link.
      - name: Install Linux native build deps
        if: ${{ matrix.linux }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libdbus-1-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      # x64 builds both ISA tiers so the runtime loader always finds its match
      # (the modern/baseline trap). arm64 has no tier split.
      - name: Build native addon(s)
        working-directory: packages/natives
        run: |
          if [ "${{ matrix.dual_tier }}" = "true" ]; then
            TARGET_VARIANT=modern bun run build
            TARGET_VARIANT=baseline bun run build
          else
            bun run build
          fi

      - name: Compile self-contained binary
        working-directory: packages/coding-agent
        run: bun run build

      - name: Stage release asset
        run: |
          src="packages/coding-agent/dist/omp"
          [ "${{ matrix.windows }}" = "true" ] && src="packages/coding-agent/dist/omp.exe"
          mv "$src" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}" || true
          ls -lh "${{ matrix.asset }}"
          echo "ASSET_NAME=${{ matrix.asset }}" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_NAME }}
